storage:
  dbPath: /data/db
net:
  port: 27017
  bindIp: 0.0.0.0
  tls:
    mode: requireTLS
    certificateKeyFile: /tmp/mongo-tls/server.pem
    CAFile: /tmp/mongo-tls/ca.crt
    allowConnectionsWithoutCertificates: true
    disabledProtocols: TLS1_0,TLS1_1
security:
  authorization: enabled
  javascriptEnabled: false
setParameter:
  enableLocalhostAuthBypass: false
systemLog:
  destination: file
  path: /data/db/mongod.log
  logAppend: true
