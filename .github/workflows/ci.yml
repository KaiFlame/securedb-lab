name: Unit and frontend checks
on: [push, pull_request]
permissions: {contents: read}
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - run: python scripts/lab.py setup
      - run: pytest tests -m "not integration" -q
      - run: python scripts/lab.py preflight
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci && npm test && npm run build
        working-directory: web

  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1 launcher checks (mocked Docker)
        shell: powershell
        run: .\tests\windows_cli.ps1 -OutputPath evidencias/windows_cli.json
      - uses: actions/upload-artifact@v4
        with:
          name: windows-launcher-source-checks
          path: evidencias/windows_cli.json
